  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t: center; color: #f2f3ee; padding: clamp(96px,16vw,120px) clamp(24px,7vw,64px) clamp(48px,10vw,80px); overflow: hidden;\">\n    <img src=\"ca555906-978b-471c-b7a7-4bd2a9aec19d\" alt=\"西荻窪 HiyaChu 店頭\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: heroA 12s ease-in-out infinite;\">\n    <img src=\"3f5616cc-0d67-4bbc-9cef-5238b3624227\" alt=\"冷やし中華\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: heroB 12s ease-in-out infinite;\">\n    <div style=\"position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,26,73,.72) 0%, rgba(16,26,73,.58) 40%, rgba(11,18,58,.9) 100%);\"><\u002Fdiv>\n    <div style=\"position: absolute; top: clamp(22px,6vw,34px); left: 0; right: 0; text-align: center; z-index: 3;\" class=\"eyebrow\">\n      <span style=\"animation: fade 1.2s ease both;\">西荻窪 · 冷やし中華専門店<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center;\">\n      <img src=\"44c61143-5eb3-45f6-a1ea-2b0663de2345\" alt=\"HiyaChu — Cold noodle\" class=\"rise1\" style=\"height: clamp(58px,15vw,88px); width: auto; border-radius: 4px; box-shadow: 0 18px 48px rgba(0,0,0,.4); margin-bottom: clamp(30px,7vw,44px);\">\n      <h1 class=\"serif rise2\" style=\"font-weight: 500; font-size: clamp(46px, 12vw, 104px); line-height: .95; letter-spacing: -.01em;\">Chilled ramen,<br><em style=\"font-style: italic; color: #b9c6ef;\">all year<\u002Fem> round.<\u002Fh1>\n      <div class=\"rise3\" style=\"width: 60px; height: 2px; background: #6f88d8; margin: clamp(26px,6vw,34px) 0; transform-origin: center; animation: drawline .9s ease .7s both;\"><\u002Fdiv>\n      <p class=\"rise3\" style=\"max-width: 30ch; font-size: clamp(14px,3.6vw,16px); line-height: 1.9; color: #dbe1f2; font-weight: 300;\">一年中、冷たいものだけを。NYからの逆輸入、西荻窪の2階の隠れ家。<\u002Fp>\n      <div class=\"mincho rise4\" style=\"margin-top: clamp(26px,6vw,36px); font-size: clamp(14px,3.8vw,16px); letter-spacing: .14em; color: #f2f3ee;\">ひやちゅう / 群青<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CREDENTIALS STRIP ============ -->\n  <div style=\"background: #0b123a; color: #93a4d8; padding: 18px clamp(20px,6vw,40px); display: flex; gap: clamp(16px,5vw,40px); flex-wrap: wrap; justify-content: center; font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; text-align: center;\">\n    <span>NYC 2016<\u002Fspan><span style=\"color:#3f4f86;\">—<\u002Fspan>\n    <span>Japan 2019<\u002Fspan><span style=\"color:#3f4f86;\">—<\u002Fspan>\n    <span>西荻窪 2023<\u002Fspan><span style=\"color:#3f4f86;\">—<\u002Fspan>\n    <span>Counter of 8<\u002Fspan><span style=\"color:#3f4f86;\">—<\u002Fspan>\n    <span>TRY Award ’24–’25<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ============ ORIGIN STORY ============ -->\n  <section class=\"pad\" style=\"background: #eef0ea;\">\n    <div class=\"wrap\" style=\"max-width: 720px;\">\n      <div class=\"eyebrow\" style=\"color:#7a86ad; text-align:center;\">The origin · NYからの逆輸入<\u002Fdiv>\n      <h2 class=\"serif\" style=\"text-align:center; font-weight: 500; font-size: clamp(34px, 8vw, 58px); line-height: 1.04; color: #17204d; margin-top: 16px;\">Reverse-imported<br>from New York.<\u002Fh2>\n      <figure style=\"margin-top: clamp(30px,7vw,42px); border-radius: 6px; overflow: hidden; box-shadow: 0 22px 54px rgba(23,32,77,.2);\">\n        <img src=\"23c92bee-9ccb-456c-aad5-d52ed7779a41\" alt=\"代表 三浦直子さん\" style=\"width:100%; height:auto;\">\n        <figcaption class=\"eyebrow\" style=\"color:#7a86ad; text-align:center; padding: 14px 0 0; font-size: 10.5px;\">Naoko Miura · 代表 三浦直子<\u002Ffigcaption>\n      <\u002Ffigure>\n      <div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: clamp(32px,7vw,44px);\">\n        <p style=\"font-size: clamp(15px,4vw,16px); line-height: 2; color: #303a63;\">代表の三浦直子さんが「常夏のハワイなら、一年中冷やし中華を楽しんでもらえる」と発想したのが原点。フラダンスイベント運営・映像翻訳者という異色の経歴の持ち主です。<\u002Fp>\n        <p style=\"font-size: clamp(15px,4vw,16px); line-height: 2; color: #303a63;\">ハワイ出店は断念しましたが、2016年からNYで3年連続の夏季ポップアップを成功させ、逆輸入のかたちで2019年に赤坂で日本初上陸。赤坂・吉祥寺の間借りを経て、2023年7月27日、西荻窪に初の自店を開きました。<\u002Fp>\n        <p class=\"mincho\" style=\"font-size: clamp(16px,4.4vw,18px); line-height: 2; letter-spacing: .04em; color: #17204d; border-left: 2px solid #6f88d8; padding-left: 20px;\">「ないものを、やる」。<br>一年中、冷やし中華だけを出す。前例のない専門店です。<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FEATURE DISH (full-bleed photo) ============ -->\n  <section style=\"position: relative; background: #0b123a;\">\n    <img src=\"c62772e3-a560-49c4-b673-badcf204e52b\" alt=\"中太平打ち麺のグリーンソース冷やし中華\" style=\"width: 100%; height: clamp(280px, 70vw, 640px); object-fit: cover;\">\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: clamp(24px,7vw,48px); background: linear-gradient(0deg, rgba(11,18,58,.9), rgba(11,18,58,0)); color: #f2f3ee;\">\n      <div class=\"wrap\">\n        <div class=\"eyebrow\" style=\"color:#b9c6ef;\">Signature<\u002Fdiv>\n        <div class=\"serif\" style=\"font-size: clamp(26px,6vw,44px); margin-top: 8px;\">Green Sauce<\u002Fdiv>\n        <div class=\"mincho\" style=\"font-size: clamp(12px,3.4vw,14px); letter-spacing:.1em; color:#cdd5ee; margin-top: 6px;\">中太平打ち麺を冷水で締めて。ニラ×花椒のしびれ。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ THE BOWLS (menu) ============ -->\n  <section class=\"pad\" style=\"background: #17204d; color: #f2f3ee;\">\n    <div class=\"wrap\" style=\"max-width: 780px;\">\n      <div style=\"text-align:center;\">\n        <div class=\"eyebrow\">The bowls · 冷やしの一杯<\u002Fdiv>\n        <h2 class=\"serif\" style=\"font-weight: 500; font-size: clamp(32px,8vw,54px); line-height: 1.02; margin-top: 14px;\">More than two ways.<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"bowls-grid\" style=\"margin-top: clamp(34px,8vw,48px);\">\n        <article style=\"background:#101a49; border:1px solid #2a366f; border-radius:6px; overflow:hidden;\">\n          <img src=\"9f5471b2-4b42-4139-af67-1604e1507ee7\" alt=\"ブラックビネガー\" style=\"width:100%; height: clamp(240px,62vw,300px); object-fit:cover; object-position: center 72%;\">\n          <div style=\"padding: clamp(22px,5vw,28px);\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px;\">\n              <h3 class=\"serif\" style=\"font-size: clamp(24px,6vw,30px);\">Black Vinegar<\u002Fh3>\n              <span style=\"font-size:15px; color:#b9c6ef; white-space:nowrap;\">¥1,000<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"mincho\" style=\"font-size:12px; letter-spacing:.1em; color:#8fa1d6; margin:6px 0 14px;\">ブラックビネガー<\u002Fdiv>\n            <p style=\"font-size:14px; line-height:1.85; color:#cdd5ee; font-weight:300;\">酸味を飛ばしたマイルドな酢醤油。まろやかで、澄んだ涼感。昼レギュラーの一杯です。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background:#101a49; border:1px solid #2a366f; border-radius:6px; overflow:hidden;\">\n          <img src=\"df663f08-6da4-4763-83a5-97010dddffbb\" alt=\"キャビア\" style=\"width:100%; height: clamp(240px,62vw,300px); object-fit:cover;\">\n          <div style=\"padding: clamp(22px,5vw,28px);\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px;\">\n              <h3 class=\"serif\" style=\"font-size: clamp(24px,6vw,30px);\">Caviar<\u002Fh3>\n              <span style=\"font-size:15px; color:#b9c6ef; white-space:nowrap;\">Seasonal<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"mincho\" style=\"font-size:12px; letter-spacing:.1em; color:#8fa1d6; margin:6px 0 14px;\">キャビア<\u002Fdiv>\n            <p style=\"font-size:14px; line-height:1.85; color:#cdd5ee; font-weight:300;\">澄んだ麺に、キャビアをひとさじ。塩気がきらめく、攻めた季節限定の一杯。<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 26px; text-align:center; padding: 20px 22px; border: 1px dashed #2a366f; border-radius: 4px;\">\n        <span class=\"mincho\" style=\"font-size: 15px; letter-spacing:.12em; color:#f2f3ee;\">ツナチャツネ<\u002Fspan>\n        <span style=\"font-size: 13px; color:#8fa1d6;\"> — オリジナル薬味で、途中から味変を。<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SEASONAL ============ -->\n  <section class=\"pad\" style=\"background: #eef0ea;\">\n    <div class=\"wrap\">\n      <div style=\"text-align:center; margin-bottom: clamp(32px,7vw,48px);\">\n        <div class=\"eyebrow\" style=\"color:#7a86ad;\">Seasonal · 季節限定<\u002Fdiv>\n        <h2 class=\"serif\" style=\"font-weight: 500; font-size: clamp(32px,8vw,58px); line-height:1.02; color:#17204d; margin-top: 14px;\">A little experimental,<br>often.<\u002Fh2>\n        <p style=\"margin-top: 16px; font-size: clamp(14px,3.8vw,15px); color:#45507f; font-weight:300;\">和洋中の境界を越えて、限定の一杯を頻繁に。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background:#d4d7cd; border:1px solid #d4d7cd;\">\n        <div style=\"background:#eef0ea; padding: clamp(24px,6vw,34px) 16px; text-align:center;\"><div class=\"serif\" style=\"font-size: clamp(19px,5vw,24px); color:#17204d;\">Sea Urchin Cream<\u002Fdiv><div class=\"mincho\" style=\"font-size:12px; letter-spacing:.1em; color:#7a86ad; margin-top:6px;\">うにクリーム<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eef0ea; padding: clamp(24px,6vw,34px) 16px; text-align:center;\"><div class=\"serif\" style=\"font-size: clamp(19px,5vw,24px); color:#17204d;\">Foie Gras<\u002Fdiv><div class=\"mincho\" style=\"font-size:12px; letter-spacing:.1em; color:#7a86ad; margin-top:6px;\">フォアグラ<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eef0ea; padding: clamp(24px,6vw,34px) 16px; text-align:center;\"><div class=\"serif\" style=\"font-size: clamp(19px,5vw,24px); color:#17204d;\">Caviar<\u002Fdiv><div class=\"mincho\" style=\"font-size:12px; letter-spacing:.1em; color:#7a86ad; margin-top:6px;\">キャビア<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eef0ea; padding: clamp(24px,6vw,34px) 16px; text-align:center;\"><div class=\"serif\" style=\"font-size: clamp(19px,5vw,24px); color:#17204d;\">Tomato Cream<\u002Fdiv><div class=\"mincho\" style=\"font-size:12px; letter-spacing:.1em; color:#7a86ad; margin-top:6px;\">トマトクリーム<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eef0ea; padding: clamp(24px,6vw,34px) 16px; text-align:center; grid-column: 1 / -1;\"><div class=\"serif\" style=\"font-size: clamp(19px,5vw,24px); color:#17204d;\">Yurinchi<\u002Fdiv><div class=\"mincho\" style=\"font-size:12px; letter-spacing:.1em; color:#7a86ad; margin-top:6px;\">油淋鶏<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PRESS & RECOGNITION ============ -->\n  <section class=\"pad\" style=\"position: relative; background: #0b123a; color: #f2f3ee; overflow: hidden;\">\n    <div class=\"mincho\" style=\"position:absolute; top:-30px; right:10px; font-size: clamp(120px,40vw,300px); color: rgba(111,136,216,.08); line-height:1; pointer-events:none; user-select:none;\">群青<\u002Fdiv>\n    <div class=\"wrap\" style=\"position: relative; max-width: 780px;\">\n      <div style=\"text-align:center;\">\n        <div class=\"eyebrow\">Recognition · 受賞とメディア<\u002Fdiv>\n        <h2 class=\"serif\" style=\"font-weight:500; font-size: clamp(32px,8vw,56px); line-height:1; margin-top: 14px;\">Awards &amp; press.<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: clamp(34px,8vw,48px); display:flex; flex-direction:column; gap: 40px;\">\n        <div>\n          <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom: 16px;\"><span class=\"eyebrow\">Awards<\u002Fspan><span class=\"mincho\" style=\"font-size:13px; letter-spacing:.12em; color:#56679f;\">受賞<\u002Fspan><span style=\"flex:1; height:1px; background:#2a366f;\"><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\"><span style=\"font-size: clamp(14px,3.8vw,16px);\">TRY ラーメン大賞 新店部門 オリジナル<\u002Fspan><span class=\"serif\" style=\"font-size:19px; color:#b9c6ef; white-space:nowrap;\">2024–25<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom: 16px;\"><span class=\"eyebrow\">Television<\u002Fspan><span class=\"mincho\" style=\"font-size:13px; letter-spacing:.12em; color:#56679f;\">テレビ出演<\u002Fspan><span style=\"flex:1; height:1px; background:#2a366f;\"><\u002Fspan><\u002Fdiv>\n          <ul style=\"list-style:none; display:flex; flex-direction:column; gap:14px;\">\n            <li style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\"><span style=\"font-size: clamp(14px,3.8vw,15px); color:#cdd5ee;\">日本テレビ「news every.」こだわり店主の専門店<\u002Fspan><span class=\"serif\" style=\"font-size:17px; color:#6f88d8; white-space:nowrap;\">2026<\u002Fspan><\u002Fli>\n            <li style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\"><span style=\"font-size: clamp(14px,3.8vw,15px); color:#cdd5ee;\">冷やし中華アレンジレシピ紹介（AMEMIYA 共演）<\u002Fspan><span class=\"serif\" style=\"font-size:17px; color:#45579a; white-space:nowrap;\">—<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div>\n          <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom: 16px;\"><span class=\"eyebrow\">Press<\u002Fspan><span class=\"mincho\" style=\"font-size:13px; letter-spacing:.12em; color:#56679f;\">新聞・雑誌掲載<\u002Fspan><span style=\"flex:1; height:1px; background:#2a366f;\"><\u002Fspan><\u002Fdiv>\n          <ul style=\"list-style:none; display:flex; flex-direction:column; gap:14px;\">\n            <li style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\"><span style=\"font-size: clamp(14px,3.8vw,15px); color:#cdd5ee;\">東京新聞デジタル「めんくいグルメ」<\u002Fspan><span class=\"serif\" style=\"font-size:17px; color:#6f88d8; white-space:nowrap;\">2024<\u002Fspan><\u002Fli>\n            <li style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\"><span style=\"font-size: clamp(14px,3.8vw,15px); color:#cdd5ee;\">Hanako 吉祥寺特集<\u002Fspan><span class=\"serif\" style=\"font-size:17px; color:#45579a; white-space:nowrap;\">—<\u002Fspan><\u002Fli>\n            <li style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\"><span style=\"font-size: clamp(14px,3.8vw,15px); color:#cdd5ee;\">散歩の達人 西荻窪特集<\u002Fspan><span class=\"serif\" style=\"font-size:17px; color:#45579a; white-space:nowrap;\">—<\u002Fspan><\u002Fli>\n            <li style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px;\"><span style=\"font-size: clamp(14px,3.8vw,15px); color:#cdd5ee;\">味な話（三菱商事ライフサイエンス）「プロの技」<\u002Fspan><span class=\"serif\" style=\"font-size:17px; color:#45579a; white-space:nowrap;\">—<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ VISIT ============ -->\n  <section class=\"pad\" style=\"background: #eef0ea;\">\n    <div class=\"wrap\" style=\"max-width: 780px;\">\n      <div style=\"text-align:center;\">\n        <div class=\"eyebrow\" style=\"color:#7a86ad;\">Visit · 店舗情報<\u002Fdiv>\n        <h2 class=\"serif\" style=\"font-weight:500; font-size: clamp(34px,8vw,58px); line-height:1; color:#17204d; margin-top: 14px;\">Up the stairs,<br>second floor.<\u002Fh2>\n        <p style=\"margin-top: 18px; font-size: clamp(14px,3.8vw,15px); line-height:1.9; color:#45507f; font-weight:300;\">1階イタリアンの店内を抜け、2階のカウンター8席へ。西荻窪の、隠れ家。<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top: clamp(32px,7vw,44px); display:grid; grid-template-columns: 1fr 1fr; gap: 26px 32px;\">\n        <div><div class=\"eyebrow\" style=\"color:#7a86ad; font-size:10.5px; margin-bottom:8px;\">Address<\u002Fdiv><p style=\"font-size:14px; line-height:1.8; color:#17204d;\">杉並区西荻南3-8-10<br>中根ビル 2F<\u002Fp><\u002Fdiv>\n        <div><div class=\"eyebrow\" style=\"color:#7a86ad; font-size:10.5px; margin-bottom:8px;\">Access<\u002Fdiv><p style=\"font-size:14px; line-height:1.8; color:#17204d;\">JR西荻窪駅<br>南口 徒歩2分<\u002Fp><\u002Fdiv>\n        <div><div class=\"eyebrow\" style=\"color:#7a86ad; font-size:10.5px; margin-bottom:8px;\">Lunch<\u002Fdiv><p style=\"font-size:14px; line-height:1.8; color:#17204d;\">11:30–15:00<br>(L.O. 14:30)<\u002Fp><\u002Fdiv>\n        <div><div class=\"eyebrow\" style=\"color:#7a86ad; font-size:10.5px; margin-bottom:8px;\">Closed<\u002Fdiv><p style=\"font-size:14px; line-height:1.8; color:#17204d;\">5–9月 水曜のみ休<br>10–4月 木金土のみ営業<\u002Fp><\u002Fdiv>\n        <div style=\"grid-column: 1 / -1;\"><div class=\"eyebrow\" style=\"color:#7a86ad; font-size:10.5px; margin-bottom:8px;\">Dinner · HIYACHU BAR 群青<\u002Fdiv><p style=\"font-size:14px; line-height:1.8; color:#17204d;\">完全予約制コース ¥8,800（フリーフロー付き／〆のひやちゅう）<br><a href=\"tel:0368262900\" style=\"color:#3a4a86;\">03-6826-2900<\u002Fa><\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background: #101a49; color: #93a4d8; padding: clamp(48px,10vw,60px) clamp(22px,6vw,56px) clamp(40px,8vw,48px);\">\n    <div class=\"wrap\" style=\"text-align:center;\">\n      <div class=\"serif\" style=\"font-size: clamp(26px,7vw,32px); letter-spacing:.16em; color:#f2f3ee;\">HiyaChu<\u002Fdiv>\n      <div class=\"mincho\" style=\"font-size:13px; letter-spacing:.14em; margin-top:8px;\">ひやちゅう / 群青<\u002Fdiv>\n      <div style=\"display:flex; gap:10px 14px; flex-wrap:wrap; justify-content:center; font-size:11px; letter-spacing:.12em; color:#6577a8; margin-top: 24px;\">\n        <span>#西荻窪<\u002Fspan><span>#冷やし中華専門店<\u002Fspan><span>#ひやちゅう<\u002Fspan
